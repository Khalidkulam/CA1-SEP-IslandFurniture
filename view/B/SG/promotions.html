        /* Carousel Styles */
        .carousel-container {
            position: relative;
            max-width: 1200px;
            margin: 0 auto 50px;
            overflow: hidden;
        }
        
        .carousel-track {
            display: flex;
            transition: transform 0.5s ease-in-out;
        }
        
        .carousel-slide {
            min-width: 100%;
            height: 400px;
        }
        
        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }
        
        .carousel-button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 15px 20px;
            cursor: pointer;
            font-size: 24px;
            z-index: 10;
            transition: background-color 0.3s;
        }
        
        .carousel-button:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }
        
        .carousel-button.prev {
            left: 10px;
        }
        
        .carousel-button.next {
            right: 10px;
        }
        
        .carousel-indicators {
            text-align: center;
            margin-top: 15px;
        }
        
        .carousel-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #ddd;
            margin: 0 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .carousel-indicator.active {
            background-color: #c0392b;
        }

        <script>
            var countryPrefix = localStorage.getItem('urlPrefix');
            var countryId = localStorage.getItem('countryId');
            
            let featuredPromotions = [];
            let currentSlide = 0;
            
            // Load featured promotions when page loads
            window.addEventListener('load', function() {
                // Hard-coded image URLs for CA1 Sprint 2. 
                // Main Challenge: Images were hard-coded because the database path for
                // promotions images is not accurate to the actual image locations on local computer. 
                
                // Additional Challenge: Promotions also no longer active as it only existed in 2014, 
                // making it even harder to fetch, unless sql query (curdate()) filter is removed in the promotionModel.js. 

                // Using actual images from view/img/promotions/
                featuredPromotions = [
                    { 
                        imageURL: '/img/promotions/F_BM_212014-11-24.jpg',
                        description: 'BRUNNES Nov Promotion - 10% OFF',
                        sku: 'F_BM_21'  // BRIMNES bed SKU
                    },
                    { 
                        imageURL: '/img/promotions/F_SC_402014-12-06.jpg',
                        description: 'STRANDMON Nov Promo - 30% OFF',
                        sku: 'F_BM_21'  // (both promotions link to same product) - this product is just an example
                    }
                ];
                displayCarousel();
                
                // Backend API call (disabled for now - will be enabled in future sprints)
                // Once database has active promotions with correct dates, uncomment this:
                // loadFeaturedPromotions();
            });
            
            // Load featured promotions from backend
            function loadFeaturedPromotions() {
                fetch('/api/getFeaturedPromotions?countryId=' + countryId)
                    .then(response => response.json())
                    .then(data => {
                        console.log('Featured promotions loaded:', data);
                        featuredPromotions = data;
                        displayCarousel();
                    })
                    .catch(error => {
                        console.log('Error loading featured promotions:', error);
                        // Display error message
                        document.getElementById('carouselContainer').innerHTML = 
                            '<div class="alert alert-warning text-center">No featured promotions available at the moment.</div>';
                    });
            }
            
            // Display carousel with featured promotions
            function displayCarousel() {
                if (!featuredPromotions || featuredPromotions.length === 0) {
                    document.getElementById('carouselContainer').innerHTML = 
                        '<div class="alert alert-info text-center">No featured promotions available.</div>';
                    return;
                }
                
                // Build carousel HTML
                let slidesHtml = '';
                let indicatorsHtml = '';
                
                // Both featured promotions link to BRIMNES bed product (SKU: F_BM_21)
                const productSku = 'F_BM_21';
                
                featuredPromotions.forEach((promo, index) => {
                    slidesHtml += `
                        <div class="carousel-slide" onclick="goToProductDetails('${productSku}')" style="cursor: pointer;">
                            <img src="${promo.imageURL}" alt="${promo.description || 'Featured Promotion'}">
                        </div>
                    `;
                    indicatorsHtml += `
                        <span class="carousel-indicator ${index === 0 ? 'active' : ''}" onclick="goToSlide(${index})"></span>
                    `;
                });
                
                const carouselHtml = `
                    <div class="carousel-track" id="carouselTrack">
                        ${slidesHtml}
                    </div>
                    ${featuredPromotions.length > 1 ? `
                        <button class="carousel-button prev" onclick="prevSlide(); event.stopPropagation();">‹</button>
                        <button class="carousel-button next" onclick="nextSlide(); event.stopPropagation();">›</button>
                        <div class="carousel-indicators">
                            ${indicatorsHtml}
                        </div>
                    ` : ''}
                `;
                
                document.getElementById('carouselContainer').innerHTML = carouselHtml;
            }
            
            // Navigate to furniture product details page
            function goToProductDetails(sku) {
                window.location.href = '/B/' + countryPrefix + '/furnitureProductDetails.html?sku=' + sku;
            }
            
            // Carousel navigation functions
            function nextSlide() {
                if (currentSlide < featuredPromotions.length - 1) {
                    currentSlide++;
                } else {
                    currentSlide = 0;
                }
                updateCarousel();
            }
            
            function prevSlide() {
                if (currentSlide > 0) {
                    currentSlide--;
                } else {
                    currentSlide = featuredPromotions.length - 1;
                }
                updateCarousel();
            }
            
            function goToSlide(index) {
                currentSlide = index;
                updateCarousel();
            }
            
            function updateCarousel() {
                const track = document.getElementById('carouselTrack');
                const indicators = document.querySelectorAll('.carousel-indicator');
                
                if (track) {
                    track.style.transform = `translateX(-${currentSlide * 100}%)`;
                }
                
                // Update indicators
                indicators.forEach((indicator, index) => {
                    if (index === currentSlide) {
                        indicator.classList.add('active');
                    } else {
                        indicator.classList.remove('active');
                    }
                });
            }
        </script>
